name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Sin esto, Gradle genera una llave de depuración aleatoria nueva en cada corrida,
      # y Android rechaza instalar un APK nuevo sobre uno viejo firmado con otra llave
      # ("conflicto con un paquete"). Al cachearla, todas las corridas futuras firman
      # con la misma llave y el APK nuevo siempre puede reemplazar al anterior.
      - name: Cachear la llave de depuración de Android
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Instalar dependencias
        run: npm install

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Sincronizar Capacitor
        working-directory: dashboard
        run: npx cap sync android

      - name: Compilar APK (debug, sin firmar)
        working-directory: dashboard/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir el APK como descargable
        uses: actions/upload-artifact@v4
        with:
          name: barber-saas-debug-apk
          path: dashboard/android/app/build/outputs/apk/debug/app-debug.apk
