name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Sincronizar Capacitor
        working-directory: dashboard
        run: npx cap sync android

      - name: Compilar APK (debug, sin firmar)
        working-directory: dashboard/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir el APK como descargable
        uses: actions/upload-artifact@v4
        with:
          name: barber-saas-debug-apk
          path: dashboard/android/app/build/outputs/apk/debug/app-debug.apk
